mint)}.node.n4{right:8%;bottom:14%;background:var(--peach)}.mindLine{position:absolute;height:2px;background:#b6a0df;transform-origin:left center}.l1{left:38%;top:43%;width:90px;transform:rotate(-29deg)}.l2{left:59%;top:43%;width:90px;transform:rotate(29deg)}.l3{left:38%;top:54%;width:90px;transform:rotate(29deg)}.l4{left:59%;top:54%;width:90px;transform:rotate(-29deg)}.timeBox{text-align:center;background:#f0e7ff;border-radius:20px;padding:20px}.timer{font-size:38px;font-weight:700;letter-spacing:2px}.goalBar{height:9px;border-radius:9px;background:#eee8fa;overflow:hidden}.goalBar i{display:block;height:100%;background:linear-gradient(90deg,#8f68d8,#d1a2e8);border-radius:9px}.weekGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{font-size:9px;text-align:center;padding:7px 2px;border-radius:9px;background:#f4effd}.day.today{background:#9b74df;color:#fff}.calendarGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calDay{min-height:40px;background:#fff;border:1px solid #eee5f8;border-radius:8px;padding:5px;font-size:9px}.calDay.has{background:#efe5ff}.calDay.today{border:2px solid #956fdb}.settingsRow{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #eee6f7}.switch{width:46px;height:25px;border-radius:20px;background:#ddd;position:relative}.switch.on{background:#8d68d7}.switch i{position:absolute;width:19px;height:19px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s}.switch.on i{left:24px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%) translateY(20px);background:#44376c;color:#fff;padding:11px 17px;border-radius:20px;opacity:0;pointer-events:none;transition:.25s;z-index:99;font-size:12px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

<script>
const KEY='jeeBloomV5';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const iso=d=>new Date(d).toISOString().slice(0,10), today=()=>iso(new Date()), addDays=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return iso(x)};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{onboard:false,revisions:[],mistakes:[],tests:[],library:[],flashcards:[],mindmaps:[],tasks:[],goals:[],study:[],settings:{sound:false},profile:'Srushti',analysis:{}};
let revSubject='All', libSubject='All', mindIndex=0;
for(const k of ['revisions','mistakes','tests','library','flashcards','mindmaps','tasks','goals','study'])db[k]??=[];
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(name)=>{const paths={home:'<path d="M3 11.5 12 4l9 7.5v8a1.5 1.5 0 0 1-1.5 1.5H4.5A1.5 1.5 0 0 1 3 19.5z"/><path d="M9 21v-6h6v6"/>',refresh:'<path d="M20 11a8 8 0 1 0 1 4"/><path d="M20 4v7h-7"/>',chart:'<path d="M4 19V5"/><path d="M4 19h17"/><path d="m7 15 3-4 3 2 5-7"/>',book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M4 5.5v15"/>',calendar:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M7 2v4M17 2v4M3 9h18"/>',note:'<path d="M5 3h12l3 3v15H5z"/><path d="M8 11h8M8 15h6M8 7h5"/>',target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="m15 9 5-5"/>',flash:'<path d="m13 2-8 11h6l-1 9 8-12h-6z"/>',mind:'<circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="17" r="2.5"/><circle cx="19" cy="17" r="2.5"/><path d="M12 7.5v5M10.5 13.5 6.5 16M13.5 13.5l4 2.5"/>',back:'<path d="m15 18-6-6 6-6"/>',user:'<circle cx="12" cy="8" r="3.5"/><path d="M5 21c.8-4 3.2-6 7-6s6.2 2 7 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="m5 12 4 4L19 6"/>',trash:'<path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-2.5V20a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H4v-2.5h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V4h2.5v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v2.5h-.2a1.7 1.7 0 0 0-1.6 1z"/>',download:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',upload:'<path d="M12 21V9M7 14l5-5 5 5M5 3h14"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[name]||''}</svg>`};
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)};
function shell(title,sub,content){return `<div class="backrow"><button class="iconbtn" onclick="go('home')">${icon('back')}</button><div><div class="headerTitle">${title} <span style="font-size:22px">✿</span></div><div class="sectionSub">${sub}</div></div><button class="iconbtn" style="margin-left:auto" onclick="go('home')">${icon('home')}</button></div>${content}`}
function welcome(){return `<section class="screen active"><div class="hero"><div class="cloud c1"></div><div class="cloud c2"></div><div class="sun"></div><div class="heroTitle"><h1>JEE Bloom ✿</h1><p>Plan ✦ Revise ✦ Achieve</p></div><div class="quote">Big dreams<br>don’t work without<br>small, consistent steps...<br><div style="text-align:center">♡ ─── ♡</div></div><div class="mountains"></div><div class="lake"></div><div class="books"><div class="book b1">PHYSICS</div><div class="book b2">CHEMISTRY</div><div class="book b3">MATHEMATICS</div></div><div class="floral"></div><div class="welcomeCard"><h2>Hello, Future AIR-1! ♡</h2><p>Are you ready to do hard work<br>for it?</p><button class="primary" onclick="db.onboard=true;save();go('home')">Let’s Begin →</button></div></div></section>`}
function home(){return `<section class="screen active"><div class="topbar"><div><div class="brand">JEE Bloom ✿</div><small style="font-family:Kalam;color:#5b3fa2">Plan ✦ Revise ✦ Achieve</small></div><button class="iconbtn" onclick="go('settings')">${icon('user')}</button></div><div class="homeGreeting">Hello, ${esc(db.profile)} ♡</div><div class="sub">Small steps every day<br>lead to big dreams.</div><div class="goal"><div class="goalIcon">${icon('target')}</div><div><strong>Your Goal</strong><b>AIR -1 JEE ADV (2028)</b></div><span style="margin-left:auto">›</span></div><div class="grid">${tile('lav','refresh','Revision Series','Revise smart. Retain longer.','revision')}${tile('blue','chart','Test Analysis','Track. Improve. Grow.','tests')}${tile('mint','book','Formula & Notes','Keep key concepts close.','library')}${tile('pink','calendar','Daily Planner','Plan today. Build tomorrow.','planner')}${tile('lav','note','Mistake Notebook','Learn from mistakes.','mistakes')}${tile('peach','target','Master Planner','Big plans. Bigger dreams.','master')}${tile('blue','flash','Flashcards','Recall faster.','flashcards')}${tile('mint','mind','Mind Maps','See the chapter clearly.','mindmaps')}</div><div class="bottomScene">“Discipline today<br>creates the freedom tomorrow.” ♡</div></section>`}
function tile(bg,ic,t,p,id){return `<button class="tile ${bg}" onclick="go('${id}')"><div class="tileIcon" style="background:#fff8;color:#6847b7">${icon(ic)}</div><h3>${t}</h3><p>${p}</p><span class="arrow">›</span></button>`}
function revision(){const due=db.revisions.filter(r=>!r.done&&r.schedule.some(s=>!s.done&&s.due<=today())).length;const done=db.revisions.filter(r=>r.done).length;const total=db.revisions.length;const pct=total?Math.round(done/total*100):0;return shell('Revision Series','Revise smart. Retain longer.',`<div class="sectionCard"><div class="progressBox"><div><div class="muted">Today’s Progress</div><div class="ring" style="--p:${pct}%"><span>${done}/${total}</span></div></div><div style="padding-top:20px"><div class="muted">Due today</div><div style="font-size:30px;font-weight:700;color:#7251bf">${due}</div><div class="muted">2-day · 9-day · 30-day</div></div></div></div><div class="revRow due" onclick="go('revdetail','2')"><div class="cal">${icon('calendar')}</div><div><h4>2-Day Revision</h4><p>Quick revisit for better recall.</p></div><span style="margin-left:auto">›</span></div><div class="revRow due9" onclick="go('revdetail','9')"><div class="cal">${icon('calendar')}</div><div><h4>9-Day Revision</h4><p>Stronger memory, higher accuracy.</p></div><span style="margin-left:auto">›</span></div><div class="revRow due30" onclick="go('revdetail','30')"><div class="cal">${icon('calendar')}</div><div><h4>30-Day Revision</h4><p>Long-term mastery.</p></div><span style="margin-left:auto">›</span></div><div class="sectionCard"><div class="sectionLabel">Add a question/topic</div><div class="formGrid"><input class="input" id="rvTitle" placeholder="e.g. Circular Motion — centripetal acceleration"><div class="row2"><select id="rvSub"><option>Physics</option><option>Chemistry</option><option>Maths</option></select><select id="rvType"><option>Question</option><option>Topic</option></select></div><button class="primary" onclick="addRevision()">Add to Revision Series</button></div></div>`)}
function addRevision(title,subject,type='Question',source='manual'){title=title||document.getElementById('rvTitle').value.trim();subject=subject||document.getElementById('rvSub').value;type=type||document.getElementById('rvType').value;if(!title)return toast('Enter a question or topic');const d=today();db.revisions.push({id:uid(),title,subject,type,source,created:d,done:false,schedule:[2,9,30].map(n=>({day:n,due:addDays(d,n),done:false}))});save();document.getElementById('rvTitle')?.value&&(document.getElementById('rvTitle').value='');toast('Added — 2, 9 and 30 day dates scheduled');go('revision')}
function revdetail(day){let items=db.revisions.flatMap(r=>r.schedule.map(s=>({r,s}))).filter(x=>x.s.day==day&&!x.s.done&&(revSubject==='All'||x.r.subject===revSubject));const tabs=['All','Physics','Chemistry','Maths'];return shell(`${day}-Day Revision`,'Revisit. Recall. Improve.',`<div class="tabs">${tabs.map(t=>`<button class="tab ${revSubject===t?'active':''}" onclick="setRevSubject('${t}',${day})">${t}</button>`).join('')}</div><div class="sectionCard"><div class="muted">Showing ${revSubject} · ${items.length} pending</div></div><div class="list">${items.length?items.map(x=>`<div class="listItem"><button class="check" onclick="markRev('${x.r.id}',${x.s.day})"></button><div style="flex:1"><b>${esc(x.r.title)}</b><div class="muted">${x.r.subject} · added ${x.r.created} · due ${x.s.due}</div></div></div>`).join(''):'<div class="sectionCard" style="text-align:center"><b>No pending ${day}-day revisions for ${revSubject}.</b><div class="muted">Questions appear automatically on their scheduled dates.</div></div>'}</div>`)}
function setRevSubject(s,day){revSubject=s;go('revdetail',day)}
function markRev(id,day){const r=db.revisions.find(x=>x.id===id);const s=r?.schedule.find(x=>x.day==day);if(s){s.done=true;if(r.schedule.every(x=>x.done))r.done=true;save();toast('Revision marked complete');go('revdetail',day)}}
function tests(){const scores=db.tests.map(t=>Math.round((t.score/t.total)*300));const avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0;const best=scores.length?Math.max(...scores):0;const acc=db.tests.length?Math.round(db.tests.reduce((a,t)=>a+t.accuracy,0)/db.tests.length):0;return shell('Test Analysis','Track. Improve. Grow.',`<div class="quad"><div class="q lav"><div class="muted">Total Tests</div><div class="num">${db.tests.length}</div></div><div class="q blue"><div class="muted">Best /300</div><div class="num">${best}</div></div><div class="q mint"><div class="muted">Average /300</div><div class="num">${avg}</div></div><div class="q pink"><div class="muted">Avg Accuracy</div><div class="num">${acc}%</div></div></div><div class="sectionCard"><b>Score Trend</b><div class="chart">${(scores.length?scores:[0]).map((s,i)=>`<div class="bar" style="height:${Math.max(4,Math.round(s/300*120))}px"><span>T${i+1}</span></div>`).join('')}</div></div><div class="sectionCard"><b>Four-Quadrant Analysis</b><div class="quad" style="margin-top:10px"><div class="q lav"><h4>① What went well</h4><textarea class="input" id="q1" placeholder="Strengths, concepts solved...">${esc(db.analysis?.q1||'')}</textarea></div><div class="q pink"><h4>② Mistakes</h4><textarea class="input" id="q2" placeholder="Silly mistakes, wrong concepts...">${esc(db.analysis?.q2||'')}</textarea></div><div class="q blue"><h4>③ Time & Attempts</h4><textarea class="input" id="q3" placeholder="Where time was lost...">${esc(db.analysis?.q3||'')}</textarea></div><div class="q mint"><h4>④ Next Action</h4><textarea class="input" id="q4" placeholder="Specific correction for next test...">${esc(db.analysis?.q4||'')}</textarea></div></div><button class="primary" style="margin-top:10px" onclick="saveAnalysis()">Save Analysis</button></div><div class="sectionCard"><b>Add Test</b><div class="formGrid" style="margin-top:10px"><input class="input" id="tn" placeholder="Test name"><div class="row2"><input class="input" id="tp" type="number" placeholder="Score"><input class="input" id="tt" type="number" value="300" placeholder="Total"></div><div class="row2"><input class="input" id="ta" type="number" value="0" placeholder="Accuracy %"><input class="input" id="tw" placeholder="Wrong questions"></div><button class="primary" onclick="addTest()">Save Test</button></div></div><div class="list">${db.tests.slice().reverse().map(t=>`<div class="listItem"><div><b>${esc(t.name)}</b><div class="muted">${t.score}/${t.total} · ${t.accuracy}% · Wrong: ${esc(t.wrong||'—')}</div></div></div>`).join('')}</div>`)}
function saveAnalysis(){db.analysis={q1:q1.value,q2:q2.value,q3:q3.value,q4:q4.value};save();toast('Four-quadrant analysis saved')}
function addTest(){const name=tn.value.trim();if(!name)return toast('Enter test name');db.tests.push({id:uid(),name,score:+tp.value||0,total:+tt.value||300,accuracy:+ta.value||0,wrong:tw.value,date:today()});save();toast('Test saved');go('tests')}
function library(){const subjects=['All','Physics','Chemistry','Maths'];const rows=db.library.filter(x=>libSubject==='All'||x.subject===libSubject);return shell('Formula & Notes','Keep key concepts close.',`<div class="filters">${subjects.map(t=>`<button class="filter ${libSubject===t?'active':''}" onclick="filterLib('${t}')">${t}</button>`).join('')}</div><div class="sectionCard"><b>${libSubject==='All'?'All subjects':libSubject+' notes & formulas'}</b><div class="muted" style="margin-top:4px">${rows.length} saved item${rows.length===1?'':'s'}</div></div><div class="sectionCard"><b>Add text note / formula</b><div class="formGrid" style="margin-top:10px"><input class="input" id="ln" placeholder="Title"><select id="ls"><option>Physics</option><option>Chemistry</option><option>Maths</option></select><textarea class="input" id="lt" placeholder="Formula, concept or explanation"></textarea><button class="primary" onclick="addNote()">Save to Library</button></div></div><div class="sectionCard"><b>Upload formula / notes image</b><div class="muted" style="margin:5px 0">The selected subject is saved with the image.</div><select id="lis"><option>Physics</option><option>Chemistry</option><option>Maths</option></select><input id="imgFile" type="file" accept="image/*" style="margin-top:10px"><button class="smallBtn" style="margin-top:9px" onclick="uploadImg()">Store Image Offline</button></div><div id="libList" class="list">${rows.map((x)=>{const i=db.library.indexOf(x);return `<div class="listItem">${x.image?`<img src="${x.image}" style="width:75px;height:75px;object-fit:cover;border-radius:10px">`:''}<div style="flex:1"><b>${esc(x.title)}</b><div class="muted">${x.subject} · ${x.kind}</div>${x.text?`<div style="margin-top:6px;white-space:pre-wrap">${esc(x.text)}</div>`:''}</div><button class="iconbtn danger" onclick="delLib(${i})">${icon('trash')}</button></div>`}).join('')||'<div class="sectionCard muted">No saved items for this subject yet.</div>'}</div>`)}
function filterLib(s){libSubject=s;go('library')}
function addNote(){if(!ln.value.trim())return toast('Enter a title');db.library.push({id:uid(),title:ln.value,subject:ls.value,text:lt.value,kind:'Note',date:today()});save();toast('Saved');go('library')}
function uploadImg(){const f=imgFile.files[0];if(!f)return toast('Choose an image');const r=new FileReader();r.onload=()=>{db.library.push({id:uid(),title:f.name,subject:document.getElementById('lis')?.value||'Physics',kind:'Image',image:r.result,date:today()});save();toast('Image stored offline');go('library')};r.readAsDataURL(f)}
function delLib(i){db.library.splice(i,1);save();go('library')}
function planner(){const d=today();const tasks=db.tasks.filter(t=>t.date===d);const done=tasks.filter(t=>t.done).length;const hours=studyHours(d);return shell('Daily Planner','Plan today. Build tomorrow.',`<div class="sectionCard"><div class="muted">Today’s progress</div><div style="font-size:29px;font-weight:700">${tasks.length?Math.round(done/tasks.length*100):0}%</div><div class="goalBar"><i style="width:${tasks.length?done/tasks.length*100:0}%"></i></div><div class="muted" style="margin-top:7px">Study tracked today: ${hours} min</div></div><div class="sectionCard"><b>Add today’s target</b><div class="formGrid" style="margin-top:9px"><input class="input" id="pt" placeholder="e.g. Complete 20 module questions"><select id="ps"><option>Physics</option><option>Chemistry</option><option>Maths</option><option>Other</option></select><button class="primary" onclick="addTask()">Add Target</button></div></div><div class="list">${tasks.map(t=>`<div class="listItem"><button class="check ${t.done?'done':''}" onclick="toggleTask('${t.id}')"></button><div><b>${esc(t.text)}</b><div class="muted">${t.subject}</div></div><button class="iconbtn danger" onclick="delTask('${t.id}')">${icon('trash')}</button></div>`).join('')||'<div class="sectionCard muted">No targets yet. Add your first one above.</div>'}</div><div class="sectionCard"><b>Weekly Planner</b><div class="weekGrid" style="margin-top:10px">${weekDays().map(x=>`<button class="day ${x===d?'today':''}" onclick="weekDay('${x}')">${new Date(x+'T12:00').toLocaleDateString('en',{weekday:'short'})}<br>${x.slice(8)}</button>`).join('')}</div><button class="smallBtn" style="margin-top:10px" onclick="go('weekly')">Open Weekly View →</button></div><div class="sectionCard"><b>Monthly Planner</b><div class="muted">Every saved task remains attached to its date.</div><button class="smallBtn" style="margin-top:10px" onclick="go('monthly')">Open Monthly View →</button></div><div class="sectionCard"><b>Study Hours</b><div class="timeBox"><div class="timer" id="timer">00:00:00</div><button class="primary" id="timerBtn" onclick="toggleTimer()">Start Study Session</button></div></div>`)}
function weekDays(){let d=new Date();let day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return [...Array(7)].map((_,i)=>iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()+i)))}
function addTask(){if(!pt.value.trim())return toast('Enter a target');db.tasks.push({id:uid(),text:pt.value,subject:ps.value,date:today(),done:false});save();go('planner')}
function toggleTask(id){const t=db.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save();go('planner')}}
function delTask(id){db.tasks=db.tasks.filter(x=>x.id!==id);save();go('planner')}
let timerStart=null,timerInt=null;function toggleTimer(){if(timerStart){const mins=Math.max(1,Math.round((Date.now()-timerStart)/60000));db.study.push({id:uid(),date:today(),minutes:mins});save();timerStart=null;clearInterval(timerInt);toast(mins+' minutes recorded');go('planner')}else{timerStart=Date.now();timerInt=setInterval(()=>{const el=document.getElementById('timer');if(el){let s=Math.floor((Date.now()-timerStart)/1000);el.textContent=new Date(s*1000).toISOString().substr(11,8)}},500);document.getElementById('timerBtn').textContent='Stop & Save Session'}}
function studyHours(d){return db.study.filter(x=>x.date===d).reduce((a,b)=>a+b.minutes,0)}
function weekly(){const days=weekDays();return shell('Weekly Planner','See and edit each day.',`<div class="list">${days.map(d=>{const ts=db.tasks.filter(t=>t.date===d);return `<div class="sectionCard"><b>${new Date(d+'T12:00').toLocaleDateString('en',{weekday:'long',month:'short',day:'numeric'})}</b><div class="muted">${ts.filter(t=>t.done).length}/${ts.length} tasks · ${studyHours(d)} min study</div>${ts.map(t=>`<div class="listItem" style="margin-top:7px"><button class="check ${t.done?'done':''}" onclick="toggleAnyTask('${t.id}','weekly')"></button><span>${esc(t.text)}</span></div>`).join('')||'<div class="muted" style="margin-top:7px">No targets.</div>'}</div>`}).join('')}</div>`)}
function toggleAnyTask(id,screen){const t=db.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save();go(screen)}}
function monthly(){const now=new Date();const y=now.getFullYear(),m=now.getMonth();const days=new Date(y,m+1,0).getDate();return shell('Monthly Planner','Plan the month, day by day.',`<div class="sectionCard"><b>${now.toLocaleDateString('en',{month:'long',year:'numeric'})}</b><div class="calendarGrid" style="margin-top:10px">${[...Array(days)].map((_,i)=>{const d=iso(new Date(y,m,i+1));const n=db.tasks.filter(t=>t.date===d).length;return `<button class="calDay ${n?'has':''} ${d===today()?'today':''}" onclick="monthDay('${d}')"><b>${i+1}</b>${n?`<br>${n} task${n>1?'s':''}`:''}</button>`}).join('')}</div></div><div class="sectionCard"><b>Monthly goals</b><div class="list">${db.goals.filter(g=>g.type==='month').map(g=>goalHtml(g)).join('')||'<div class="muted">Use Master Planner to add monthly goals.</div>'}</div></div>`)}
function monthDay(d){const ts=db.tasks.filter(t=>t.date===d);toast(ts.length?ts.length+' task(s) on '+d:'No tasks on '+d)}
function mistakes(){return shell('Mistake Notebook','Learn from mistakes.',`<div class="sectionCard"><b>Save a mistake</b><div class="formGrid" style="margin-top:9px"><textarea class="input" id="mt" placeholder="Question / what went wrong"></textarea><div class="row2"><select id="ms"><option>Physics</option><option>Chemistry</option><option>Maths</option></select><input class="input" id="mc" placeholder="Chapter"></div><textarea class="input" id="mw" placeholder="Why did I get it wrong?"></textarea><textarea class="input" id="ml" placeholder="Correct concept / action"></textarea><button class="primary" onclick="addMistake()">Save Mistake + Add to Revision</button></div></div><div class="list">${db.mistakes.slice().reverse().map(m=>`<div class="listItem"><div style="flex:1"><b>${esc(m.title)}</b><div class="muted">${m.subject} · ${m.chapter||'No chapter'} · ${m.date}</div><div style="margin-top:5px">${esc(m.why||'')}</div><div class="muted" style="margin-top:4px">Automatically scheduled for 2, 9 and 30 days.</div></div></div>`).join('')||'<div class="sectionCard muted">No mistakes saved yet.</div>'}</div>`)}
function addMistake(){if(!mt.value.trim())return toast('Enter the mistake');const m={id:uid(),title:mt.value,subject:ms.value,chapter:mc.value,why:mw.value,learn:ml.value,date:today()};db.mistakes.push(m);db.revisions.push({id:uid(),title:m.title,subject:m.subject,type:'Mistake',source:'mistake-notebook',created:m.date,done:false,schedule:[2,9,30].map(n=>({day:n,due:addDays(m.date,n),done:false}))});save();toast('Mistake saved and entered Revision Series');go('mistakes')}
function flashcards(){const c=db.flashcards;const cur=c[flashIndex%c.length];return shell('Flashcards','Recall faster. Mark what you know.',`<div class="sectionCard"><div class="flash"><div class="flashCard" onclick="flipCard()"><div>${cur?(flipped?`<div class="muted">Answer</div><p>${esc(cur.back)}</p>`:`<div class="muted">Question</div><h2>${esc(cur.front)}</h2>`):'<div><h2>No cards yet</h2><p>Create your first card below.</p></div>'}</div></div></div><div class="flashActions"><button class="smallBtn danger" onclick="rateCard(false)">I don’t know</button><button class="smallBtn success" onclick="rateCard(true)">I know it</button></div><div class="sectionCard"><b>Create Flashcard</b><div class="formGrid" style="margin-top:9px"><input class="input" id="ff" placeholder="Front / question"><textarea class="input" id="fb" placeholder="Back / answer"></textarea><button class="primary" onclick="addFlash()">Add Flashcard</button></div></div><div class="muted" style="text-align:center">${c.length?`Card ${flashIndex+1} of ${c.length}`:'Flashcards stay offline on this device.'}</div>`)}
let flashIndex=0,flipped=false;function flipCard(){flipped=!flipped;go('flashcards')}function addFlash(){if(!ff.value.trim()||!fb.value.trim())return toast('Fill both sides');db.flashcards.push({id:uid(),front:ff.value,back:fb.value,known:0,seen:0});save();flashIndex=db.flashcards.length-1;flipped=false;go('flashcards')}function rateCard(known){if(!db.flashcards.length)return;const c=db.flashcards[flashIndex%db.flashcards.length];c.seen++;if(known)c.known++;save();flashIndex=(flashIndex+1)%db.flashcards.length;flipped=false;go('flashcards')}
function mindmaps(){const m=db.mindmaps[mindIndex]||{};return shell('Mind Maps','See the chapter clearly.',`<div class="filters">${db.mindmaps.map((x,i)=>`<button class="filter ${i===mindIndex?'active':''}" onclick="selectMind(${i})">${esc(x.root||'Mind Map '+(i+1))}</button>`).join('')}<button class="filter" onclick="newMind()">+ New Mind Map</button></div><div class="mindCanvas"><div class="mindLine l1"></div><div class="mindLine l2"></div><div class="mindLine l3"></div><div class="mindLine l4"></div><div class="node root">${esc(m.root||'JEE Topic')}</div><div class="node n1">${esc(m.a||'Concept')}</div><div class="node n2">${esc(m.b||'Formula')}</div><div class="node n3">${esc(m.c||'PYQs')}</div><div class="node n4">${esc(m.d||'Mistakes')}</div></div><div class="sectionCard"><b>${db.mindmaps.length?'Edit Mind Map':'Create Mind Map'}</b><div class="formGrid" style="margin-top:9px">${['root','a','b','c','d'].map((k,i)=>`<input class="input" id="mm${k}" placeholder="${['Central topic','Branch 1','Branch 2','Branch 3','Branch 4'][i]}" value="${esc(m[k]||'')}">`).join('')}<button class="primary" onclick="saveMind()">${db.mindmaps.length?'Save Changes':'Save Mind Map'}</button></div></div><div class="list">${db.mindmaps.map((x,i)=>`<div class="listItem"><div style="flex:1"><b>${esc(x.root||'Untitled')}</b><div class="muted">${[x.a,x.b,x.c,x.d].filter(Boolean).length} branches</div></div><button class="smallBtn" onclick="selectMind(${i})">Open</button></div>`).join('')}</div>`)}
function newMind(){db.mindmaps.push({root:'',a:'',b:'',c:'',d:''});mindIndex=db.mindmaps.length-1;save();go('mindmaps')}
function selectMind(i){mindIndex=i;go('mindmaps')}
function saveMind(){const m={root:mmroot.value||'JEE Topic',a:mma.value||'Concept',b:mmb.value||'Formula',c:mmc.value||'PYQs',d:mmd.value||'Mistakes'};if(db.mindmaps.length)db.mindmaps[mindIndex]=m;else{db.mindmaps.push(m);mindIndex=0}save();toast('Mind map saved');go('mindmaps')}
function goalHtml(g){const pct=g.target?Math.min(100,Math.round(g.progress/g.target*100)):0;return `<div class="listItem"><div style="flex:1"><b>${esc(g.title)}</b><div class="muted">${g.type} · ${g.progress}/${g.target}</div><div class="goalBar" style="margin-top:7px"><i style="width:${pct}%"></i></div></div><button class="smallBtn" onclick="incGoal('${g.id}')">+1</button></div>`}
function master(){return shell('Master Planner','Big plans. Bigger dreams.',`<div class="sectionCard"><b>Add a goal</b><div class="formGrid" style="margin-top:9px"><input class="input" id="gt" placeholder="Goal e.g. Finish Physics module"><div class="row2"><select id="gy"><option value="short">Short-term</option><option value="month">Monthly</option><option value="mid">Mid-term</option><option value="long">Long-term</option></select><input class="input" id="gnum" type="number" value="10" min="1" placeholder="Target units"></div><button class="primary" onclick="addGoal()">Add Goal</button></div></div><div class="list">${db.goals.map(goalHtml).join('')||'<div class="sectionCard muted">No goals yet.</div>'}</div>`)}
function addGoal(){if(!gt.value.trim())return toast('Enter a goal');db.goals.push({id:uid(),title:gt.value,type:gy.value,target:+gnum.value||1,progress:0});save();go('master')}
function incGoal(id){const g=db.goals.find(x=>x.id===id);if(g){g.progress=Math.min(g.target,g.progress+1);save();toast('Goal progress updated');go('master')}}
function settings(){return shell('Settings','Your app, your data.',`<div class="sectionCard"><div class="settingsRow"><span>Profile name</span><input class="input" style="width:160px" id="profile" value="${esc(db.profile)}" onchange="db.profile=this.value||'Srushti';save()"></div><div class="settingsRow"><span>App data</span><span class="muted">Stored offline</span></div><div class="settingsRow"><span>Backup</span><button class="smallBtn" onclick="backup()">${icon('download')} Export</button></div><div class="settingsRow"><span>Restore</span><label class="smallBtn">${icon('upload')} Import<input type="file" accept="application/json" hidden onchange="restore(event)"></label></div><div class="settingsRow"><span>Clear all data</span><button class="smallBtn danger" onclick="clearData()">Clear</button></div></div><div class="sectionCard"><b>JEE Bloom v5.0</b><div class="muted">Fully offline app logic · automatic revision scheduling · working planner, analysis, library, flashcards and mind maps.</div></div>`)}
function backup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jee-bloom-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Backup exported')}
function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);db=x;save();toast('Backup restored');go('home')}catch{toast('Invalid backup file')}};r.readAsText(f)}
function clearData(){if(confirm('Clear all JEE Bloom data?')){localStorage.removeItem(KEY);location.reload()}}
function go(id,arg){const a=document.getElementById('app');let html='';if(id==='welcome')html=welcome();else if(id==='home')html=home();else if(id==='revision')html=revision();else if(id==='revdetail')html=revdetail(arg||2);else if(id==='tests')html=tests();else if(id==='library')html=library();else if(id==='planner')html=planner();else if(id==='weekly')html=weekly();else if(id==='monthly')html=monthly();else if(id==='mistakes')html=mistakes();else if(id==='flashcards')html=flashcards();else if(id==='mindmaps')html=mindmaps();else if(id==='master')html=master();else if(id==='settings')html=settings();a.innerHTML=html;window.scrollTo(0,0)}
if(!db.onboard)go('welcome');else go('home');
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js', {scope: './'}).catch(function(err){ console.warn('JEE Bloom offline setup failed', err); });
  });
}
</script>
</body></html>
